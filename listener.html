<!doctype html>
<!-- Audio Share: the world opens this page (hidden) as listener.html#code=ABCDE and plays whatever
     sound is being shared to that code. -->
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Share Listener</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
  <audio id="a" autoplay></audio>
  <script>
  (function () {
    var m = location.hash.match(/code=([A-Za-z0-9]+)/), code = m ? m[1].toUpperCase() : "";
    var a = document.getElementById("a");
    var state = "starting", peer = null, conn = null, lastAgain = 0;
    // Ask for good stereo music quality instead of the voice-call default
    function hq(sdp) {
      return sdp.replace(/a=fmtp:(\d+) ([^\r\n]*useinbandfec=1[^\r\n]*)/g, function (all, pt, rest) {
        rest = rest.replace(/;?\s*(stereo|sprop-stereo|maxaveragebitrate)=[^;]*/g, "");
        return "a=fmtp:" + pt + " " + rest + ";stereo=1;sprop-stereo=1;maxaveragebitrate=256000";
      });
    }
    function report() {
      try { if (window.O && typeof window.O.sendMessage === "function")
        window.O.sendMessage("app", JSON.stringify({ from: "as", state: state, code: code, playing: !!(a.srcObject && !a.paused) })); } catch (e) {}
    }
    function st(s) { if (s !== state) { state = s; report(); } }
    setInterval(report, 2000);

    // Volume from the world (glides, no steps)
    var vt = null, vn = null;
    setInterval(function () { if (vt === null) return; if (vn === null) vn = vt; vn += (vt - vn) * 0.15; if (Math.abs(vt - vn) < 0.004) vn = vt; a.volume = Math.max(0, Math.min(1, vn)); }, 50);
    window.__asVol = function (x) { if (isFinite(x)) vt = Math.max(0, Math.min(1, x)); };
    window.addEventListener("bsmessage", function (e) {
      try { var d = JSON.parse(e.detail.message); if (d && typeof d.asvol === "number") window.__asVol(d.asvol); } catch (x) {}
    });

    function idle() { a.pause(); a.srcObject = null; st("waiting"); }
    function start() {
      if (!code) { st("nocode"); return; }
      peer = new Peer();
      peer.on("open", function () { st("waiting"); connect(); });
      peer.on("call", function (call) {
        call.answer(undefined, { sdpTransform: hq });
        call.on("stream", function (s) { a.srcObject = s; var p = a.play(); if (p && p.catch) p.catch(function () {}); st("playing"); });
        call.on("close", idle);
      });
      peer.on("error", function (e) { if (e.type !== "peer-unavailable") st("error"); });
      peer.on("disconnected", function () { try { peer.reconnect(); } catch (e) {} });
    }
    function connect() {
      if (!peer || peer.destroyed || (conn && conn.open)) return;
      conn = peer.connect("bsas-" + code.toLowerCase(), { reliable: true });
      conn.on("close", function () { conn = null; idle(); });
    }
    // Keep trying until someone shares (and again after they stop)
    setInterval(function () {
      if (!conn || !conn.open) { connect(); return; }
      if (state !== "playing" && Date.now() - lastAgain > 9000) { lastAgain = Date.now(); try { conn.send("again"); } catch (e) {} }
    }, 3000);
    start();
  })();
  </script>
</body>
</html>
